name: Build and publish launcher updates

on:
  push:
    branches:
      - 'publish/v*'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore binary build assets
        run: node scripts/restore-build-assets.cjs

      - name: Build and publish the Windows installer and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm exec electron-builder --win nsis --x64 --publish always
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Build failed (attempt $attempt); retrying after a short delay."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

