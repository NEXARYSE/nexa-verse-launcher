name: Build and publish launcher updates

# v0.5.22 release build for the updated controller navigation and countdown.
on:
  push:
    branches:
      - 'publish/v*'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Cache Electron Builder toolsets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-v1
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore binary build assets
        run: node scripts/restore-build-assets.cjs

      - name: Build and publish the Windows installer and update metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm exec electron-builder --win nsis --x64 --publish always
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Build failed (attempt $attempt); retrying after a short delay."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          DEBUG: electron-builder
